components:
  schemas:
    Account:
      required:
        - accountId
        - accountNumber
        - customerId
        - accountType
        - balance
        - status
        - openedAt
        - updatedAt
      type: object
      properties:
        accountId:
          type: string
          example: A2000
        accountNumber:
          pattern: ^[0-9]{7}$
          type: string
          example: "0002000"
        customerId:
          type: string
          example: C1000
        accountType:
          enum:
            - SAVINGS
            - FIXED
            - CHECKING
          type: string
        balance:
          format: double
          minimum: 0
          type: number
          example: 100000
        status:
          enum:
            - ACTIVE
            - FROZEN
            - CLOSED
          type: string
        openedAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
      additionalProperties: false
    AccountCreateRequest:
      required:
        - customerId
        - accountType
      type: object
      properties:
        customerId:
          type: string
          example: C1000
        accountType:
          enum:
            - SAVINGS
            - FIXED
            - CHECKING
          type: string
        balance:
          format: double
          default: 0
          minimum: 0
          type: number
      additionalProperties: false
    AccountList:
      required:
        - accounts
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      additionalProperties: false
    AmountRequest:
      required:
        - amount
      type: object
      properties:
        amount:
          format: double
          minimum: 0
          type: number
          example: 10000
        description:
          maxLength: 200
          type: string
      additionalProperties: false
    Customer:
      required:
        - customerId
        - fullName
        - fullNameKana
        - dateOfBirth
        - phoneNumber
        - email
        - postalCode
        - address
        - status
        - createdAt
        - updatedAt
