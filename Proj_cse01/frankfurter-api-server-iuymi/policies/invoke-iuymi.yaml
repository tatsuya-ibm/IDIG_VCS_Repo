kind: Invoke
apiVersion: api.ibm.com/v1
metadata:
  name: invoke-iuymi
  namespace: Proj_cse01
  version: "1.0"
  tags: []
  domain: mcp
  labels:
    gatewayTypes:
      - nano
spec:
  endpoint:
    http:
      target:
        tlsClientProfile: sample-tls-client-profile:1.0.0
        url: "'https://api.frankfurter.dev/v1' & $pathAndQuery()"
        urlType: jsonata
        persistentConnections: false
        timeout: 30
        decompressResponse: true
        followRedirects: false
        chunkedUpload: false
